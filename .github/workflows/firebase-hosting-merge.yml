name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Poetry
        run: pipx install poetry
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'poetry'
      - name: Install dependencies
        run: poetry install --only main
      - name: Build site
        run: cd erlenepsyd.com && poetry run pelican content/
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ER_PROD_6F5E5 }}
          channelId: live
          projectId: er-prod-6f5e5
